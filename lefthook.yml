# Quiet by default, use LEFTHOOK_VERBOSE=1 for full output
output:
  - summary
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "*.{js,jsx,ts,tsx,json,css,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

    - name: eslint
      glob: "*.{js,jsx,ts,tsx}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true

    - name: typecheck
      run: npx tsc --noEmit

    - name: test
      run: bun test

# Keep dist/ fresh: ~/.local/bin/try-ink runs dist/cli.js (~0.1s) instead of
# `npx tsx src/cli.tsx` (~0.6s), so rebuild whenever the source may have changed.
post-commit:
  jobs:
    - name: build
      run: bun run build

post-merge:
  jobs:
    - name: build
      run: bun run build

post-checkout:
  jobs:
    - name: build
      run: bun run build
